    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif"><text x="56" y="56.6" fill="#1c9a8f" font-size="15" font-weight="700" letter-spacing=".6">Psanctuary</text><text x="56" y="122.2" fill="#ccfbf1" font-size="60" font-weight="700" letter-spacing="-.5">.github</text><text x="56" y="166.0" fill="#b1ddd5" font-size="23">The organisation's profile, its welcome deck, and</text><text x="56" y="196.8" fill="#b1ddd5" font-size="23">the defaults every repository shares.</text></g>
  </g>
</svg>
